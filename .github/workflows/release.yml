name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './git-archiver-v2/src-tauri -> target'

      - name: Install frontend dependencies
        working-directory: git-archiver-v2
        run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: 'git-archiver-v2'
          tagName: ${{ github.ref_name }}
          releaseName: 'Git Archiver ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Compute SHA-256 checksums (unix)
        if: matrix.platform != 'windows-latest'
        shell: bash
        working-directory: git-archiver-v2/src-tauri/target
        run: |
          # tauri-action drops bundles into target/<triple>/release/bundle/<type>/.
          # Hash every produced bundle artifact and write one checksums file
          # per matrix entry so the upload step gets a unique filename.
          set -euo pipefail
          out="checksums-${{ matrix.platform }}.txt"
          : > "$out"
          while IFS= read -r -d '' f; do
            (cd "$(dirname "$f")" && shasum -a 256 "$(basename "$f")") >> "../../$out" || true
          done < <(find . -type f \( -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" \) -print0)
          # Surface filename — even if empty, the upload step needs the file to exist.
          mv "$out" "../../$out" 2>/dev/null || true
          cat "../../$out" || true

      - name: Compute SHA-256 checksums (windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        working-directory: git-archiver-v2/src-tauri/target
        run: |
          $out = "checksums-${{ matrix.platform }}.txt"
          Get-ChildItem -Recurse -Include *.exe,*.msi | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Out-File -Encoding ascii $out
          Get-Content $out

      - name: Upload checksums as release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: git-archiver-v2/src-tauri/target/checksums-${{ matrix.platform }}.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
